<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestial Trainer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>Celestial Trainer v1.4</h2>
    <p>Offline Training App</p>
</header>

<div class="warning">
FOR TRAINING ONLY — NOT FOR OFFICIAL NAVIGATION
</div>

<div class="tabs">
    <button class="tab active" onclick="openTab('sextant',this)">Sextant</button>
    <button class="tab" onclick="openTab('gyro',this)">Gyro</button>
    <button class="tab" onclick="openTab('compass',this)">Compass</button>
    <button class="tab" onclick="openTab('observation',this)">Observation</button>
    <button class="tab" onclick="openTab('notes',this)">Notes</button>
</div>

<div id="sextant" class="section active">
    <div class="card">
        <h3>Digital Sextant</h3>

        <div id="sextantBox">
            <div class="horizon"></div>
            <div class="cross"></div>
        </div>

        <button class="main" onclick="startSextant()">Start Sensor</button>

        <div class="result">
            Hs: <span id="altitude">--</span>
        </div>

        <p>UTC: <span id="utc">--</span></p>
    </div>
</div>

<div id="gyro" class="section">
    <div class="card">
        <h3>Gyro Error Calculator</h3>

        <label>True Bearing</label>
        <input id="trueBearing" type="number">

        <label>Gyro Bearing</label>
        <input id="gyroBearing" type="number">

        <button class="main" onclick="calcGyro()">Calculate</button>

        <div class="result" id="gyroResult">--</div>
    </div>
</div>

<div id="compass" class="section">
    <div class="card">

        <h3>Compass Error Calculator</h3>

        <label>True Bearing</label>
        <input id="trueCompass" type="number">

        <label>Compass Bearing</label>
        <input id="compassBearing" type="number">

        <button class="main" onclick="calcCompass()">Calculate</button>

        <div class="result" id="compassResult">--</div>

        <hr>

        <h3>Total Error</h3>

        <label>Variation</label>
        <input id="variation" type="number">

        <label>Deviation</label>
        <input id="deviation" type="number">

        <button class="main" onclick="calcTotalError()">Calculate</button>

        <div class="result" id="totalErrorResult">--</div>

    </div>
</div>

<div id="observation" class="section">
    <div class="card">

        <h3>Compass Observation</h3>

        <label>Source</label>
        <select id="sourceMode">
            <option value="manual">Manual</option>
            <option value="gps">GPS</option>
        </select>

        <label>Date</label>
        <input id="obsDate" type="date">

        <label>UTC</label>
        <input id="obsTime" type="time">

        <label>Latitude</label>
        <input id="obsLat" type="text" placeholder="08°43.5'N">

        <label>Longitude</label>
        <input id="obsLon" type="text" placeholder="086°48.3'E">

        <label>Object</label>
        <select id="objectName">
            <option>Sun</option>
            <option>Moon</option>
            <option>Venus</option>
            <option>Mars</option>
            <option>Jupiter</option>
            <option>Saturn</option>
            <option>Polaris</option>
            <option>Sirius</option>
            <option>Canopus</option>
        </select>

        <label>Gyro Bearing</label>
        <input id="obsGyro" type="number">

        <label>Standard Bearing</label>
        <input id="obsStandard" type="number">

        <label>Variation</label>
        <input id="obsVariation" type="number">

        <button class="main" onclick="calculateObservation()">
            Calculate Observation
        </button>

        <div class="result" id="observationResult">
            Waiting for calculation...
        </div>

    </div>
</div>

<div id="notes" class="section">
    <div class="card">
        <h3>Notes</h3>
        <p>Training use only.</p>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
