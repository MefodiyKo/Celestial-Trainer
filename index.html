<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestial Test</title>
<style>
body{font-family:Arial;background:#0b1b2b;color:white;margin:0}
.tabs{display:flex;background:#173b5c}
button{flex:1;padding:15px;background:#173b5c;color:white;border:0}
button.active{background:#1f6fa8}
.section{display:none;padding:20px}
.section.active{display:block}
</style>
</head>
<body>

<h2>Celestial Trainer Test</h2>

<div class="tabs">
<button class="tab active" onclick="openTab('one',this)">One</button>
<button class="tab" onclick="openTab('two',this)">Two</button>
<button class="tab" onclick="openTab('three',this)">Three</button>
</div>

<div id="one" class="section active">
<h3>Tab One works</h3>
</div>

<div id="two" class="section">
<h3>Tab Two works</h3>
</div>

<div id="three" class="section">
<h3>Tab Three works</h3>
</div>

<script>
function openTab(id,btn){
document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
document.getElementById(id).classList.add('active');
btn.classList.add('active');
}
</script>

</body>
</html>
